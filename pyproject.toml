[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "onto-sieve"
version = "0.1.0"
description = "Validate and quarantine ontology-grounded JSON triple records"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
onto-sieve = "onto_sieve:main"

[tool.setuptools]
py-modules = ["onto_sieve"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
